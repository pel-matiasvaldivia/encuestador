version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-satisfactio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-satisfactio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-satisfactio} -d ${POSTGRES_DB:-satisfactio}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  backend:
    # Production: pull pre-built image from GitHub Container Registry
    image: ghcr.io/pel-matiasvaldivia/encuestador/backend:latest
    # Local dev: comment the image line above and uncomment the build block below
    # build:
    #   context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-satisfactio}:${POSTGRES_PASSWORD:-secret}@postgres:5432/${POSTGRES_DB:-satisfactio}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-cambia_esto_en_produccion}
      - SMTP_HOST=${SMTP_HOST:-smtp.mailtrap.io}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - DOMAIN=${DOMAIN:-http://localhost}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"

  worker:
    # Production: same image as backend, different command
    image: ghcr.io/pel-matiasvaldivia/encuestador/backend:latest
    # build:
    #   context: ./backend
    command: celery -A app.tasks.celery_worker worker --loglevel=info
    depends_on:
      - backend
      - redis
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-satisfactio}:${POSTGRES_PASSWORD:-secret}@postgres:5432/${POSTGRES_DB:-satisfactio}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-cambia_esto_en_produccion}
      - SMTP_HOST=${SMTP_HOST:-smtp.mailtrap.io}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - DOMAIN=${DOMAIN:-http://localhost}
    volumes:
      - uploads_data:/app/uploads

  frontend:
    # Production: pull pre-built image from GitHub Container Registry
    image: ghcr.io/pel-matiasvaldivia/encuestador/frontend:latest
    # build:
    #   context: ./frontend
    volumes:
      - frontend_build:/app/dist

  nginx:
    image: nginx:alpine
    ports:
      - "8880:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_build:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  frontend_build:
  uploads_data:
